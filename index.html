<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Figure Exchange — Upgrading</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0b0c0f;
    color: #f4f4f5;
    padding: 24px;
    text-align: center;
  }
  .card {
    max-width: 480px;
  }
  h1 {
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 12px;
  }
  p {
    font-size: 1.05rem;
    line-height: 1.5;
    color: #a1a1aa;
    margin: 0;
  }
  .mark {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #71717a;
    margin-bottom: 18px;
  }

</head>
<body>
  <div class="card">
    <div class="mark">Figure Exchange</div>
    <h1>We're upgrading the marketplace.</h1>
    <p>Figure Exchange will be back shortly. Thanks for your patience.</p>
